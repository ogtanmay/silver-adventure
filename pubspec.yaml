name: grindos
description: Futuristic gamified productivity operating system app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  firebase_core: ^3.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  lottie: ^3.1.2
  rive: ^0.13.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/screenshots/grindos_dashboard.png
